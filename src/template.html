      if (a.counter) t.push(`<span class="tag bad">Countered</span>`); if (a.silenced) t.push(`<span class="tag bad">Silenced</span>`); if (a.disarmed) t.push(`<span class="tag bad">Disarmed</span>`);
      if (a.drawLess) t.push(`<span class="tag bad">Draws -${a.drawLess}</span>`); if (a.weakNext) t.push(`<span class="tag bad">Next hit -30%</span>`);
      if (a.noHealRound >= cb.round) t.push(`<span class="tag bad">No healing</span>`); if (a.grievous) t.push(`<span class="tag bad">Grievous</span>`); if (a.deathmark) t.push(`<span class="tag bad">Deathmark</span>`);
    }
    if (a.isPlayer && a.hot && a.hot.length) t.push(`<span class="tag good">Regrowth ${a.hot.reduce((s, x) => s + x.n, 0)}/turn</span>`);
    for (const [k, l] of [['weak', 'Weak'], ['vulnerable', 'Vuln'], ['bleed', 'Bleed'], ['poison', 'Poison'], ['burn', 'Burn'], ['chill', 'Chill'], ['slow', 'Slow']]) if (a[k]) t.push(`<span class="tag bad">${l} ${a[k]}${k === 'weak' || k === 'vulnerable' ? '%' : ''}</span>`);
    if (a.frozen) t.push(`<span class="tag bad">Frozen</span>`);
    if (!a.isPlayer && a.parryBack) t.push(`<span class="tag bad" title="Attacks into its Parry take damage back">Riposte</span>`);
    if (!a.isPlayer && a.thorns) t.push(`<span class="tag bad">Spikes ${a.thorns}</span>`);
    if (!a.isPlayer && a.regenDown.length) t.push(`<span class="tag bad">Regen -${a.regenDown.reduce((s, x) => s + x.n, 0)}</span>`);
    if (!a.isPlayer && a.phase === 2) t.push(`<span class="tag bad">Phase 2</span>`);
    return t.join('');
  }
  function intentHtml(e) {
    if (e.hp <= 0) return '';
    return e.hand.map(c => {
      if (c.status) return `<span class="intent skip" title="${esc(c.name)}: ${esc(c.text)}">${esc(c.name)}</span>`;
      const planned = e.plan.includes(c.uid), kind = CB.intentKind(c.ops);
      let num = '';
      const dmg = c.ops.find(o => o.op === 'damage' || o.op === 'execute'), blk = c.ops.find(o => o.op === 'block' || o.op === 'parry');
      if (dmg) { const hv = (c.mark && cb.actorById(c.mark)) || hero(); const res = Math.min(75, hv.resist[c.dtype] || 0) / 100; num = Math.round((dmg.n || dmg.low) * cb.dmgMult * e.dmgTune * (1 + (e.strength + e.strTurn) / 100) * (1 - e.weak / 100) * (1 + cb.pressure()) * (1 - res) * (1 + hv.vulnerable / 100)) + (dmg.times ? 'x' + dmg.times : ''); }
      else if (blk) num = blk.n;
      const mk = planned && c.mark && cb.partySize > 1 ? cb.actorById(c.mark) : null;
      const tg = mk ? `<span class="itgt" style="color:${CC[mk.cls]}">&rarr; ${mk === hero() && cb.myMi != null ? 'You' : esc(mk.name.split(' ')[0])}</span>` : '';
      return `<span class="intent ${kind}${planned ? '' : ' skip'}" data-e="${e.id}" data-cu="${c.uid}" title="${esc(c.name)} (${c.cost} mana): ${esc(c.text)}${c.dtype !== 'Physical' && dmg ? ' [' + c.dtype + ']' : ''}${mk ? ' Aimed at ' + esc(mk.name) + '.' : ''}${planned ? '' : ' (not enough mana: discarded)'}">${ICON[kind]}${num !== '' ? num : esc(c.name)}${tg}</span>`;
    }).join('') || '<span class="tag">no cards</span>';
  }
  function unitHtml(a) {
    const isNow = cb.current === a && !cb.over, targetable = (cb.duel ? a.isPlayer && a !== hero() : !a.isPlayer) && a.hp > 0 && selected && CARDS[selected.key].target === 'enemy';
    const pct = Math.max(0, 100 * a.hp / a.maxHp), ini = cb.initiative(a);
    const sub = a.isPlayer ? `Init ${ini}` : `${a.tier === 'Elite' || a.tier === 'Boss' ? a.tier + ' &middot; ' : ''}${a.type} &middot; weak ${a.weakTo} &middot; Init ${ini}`;
    return `<div class="unit ${isNow ? 'active' : ''} ${a.isPlayer && cb.partySize > 1 && a === viewHero && !isNow ? 'viewing' : ''} ${a.hp <= 0 ? 'dead' : ''} ${targetable ? 'targetable' : ''}" data-id="${a.id}" ${targetable ? 'role="button" tabindex="0"' : ''}>
      ${a.isPlayer ? '' : `<div class="intents">${intentHtml(a)}</div>`}
      ${a.isPlayer ? '' : `<button class="pilebtn deckbtn" data-enemy="${a.id}">Hand ${a.hand.length} &middot; Draw ${a.drawPile.length} &middot; Discard ${a.discard.length}</button>`}
      <div class="figure">${figure(a)}</div>
      <div class="uname"><b ${a.isPlayer ? `style="color:${CC[a.cls]}"` : ''}>${esc(a.name)}</b><small>${sub}</small></div>
      <div class="bar"><i style="width:${pct}%"></i><span>${a.hp} / ${a.maxHp}</span></div>
      <div class="tags">${tags(a)}${cb.duel && a !== hero() ? `<span class="tag">Hand ${a.hand.length} &middot; Mana ${a.mana}</span>` : ''}</div></div>`;
  }
  function popups() {
    for (const a of [...cb.players, ...cb.enemies]) {
      const el = document.querySelector(`.unit[data-id="${a.id}"]`); if (!el) continue;
      const dh = a.hp - (lastHp[a.id] ?? a.hp), db = a.block - (lastBlock[a.id] ?? a.block);
      const add = (cls, txt) => { const s = document.createElement('div'); s.className = 'pop ' + cls; s.textContent = txt; el.appendChild(s); setTimeout(() => s.remove(), 1200); };
      if (dh < 0) add('dmg', dh); else if (dh > 0) add('heal', '+' + dh);
      if (db > 0) add('blk', '+' + db);
    }
    snapshot();
  }
  function render(withPops) {
    if (!cb) return;
    const p = hero(), party = cb.partySize > 1;
    $('order').innerHTML = `<span class="lbl">Turn<br>order</span>` + cb.order.map((id, i) => { const a = cb.actorById(id); const st = a.hp <= 0 ? 'dead' : i === cb.turnIndex && !cb.over ? 'now' : i < cb.turnIndex ? 'done' : '';
      return `${i ? '<span class="osep" aria-hidden="true">&rsaquo;</span>' : ''}<div class="otile ${a.isPlayer ? 'hero' : 'foe'} ${st}" style="--oc:${a.isPlayer ? CC[a.cls] : '#e0b8a8'}" title="${esc(a.name)}: Initiative ${cb.initiative(a)}, HP ${a.hp}/${a.maxHp}"><span class="oini">${cb.initiative(a)}</span><div class="ofig">${figure(a)}</div><div class="onm">${a.isPlayer && !party ? 'You' : a === p && cb.myMi != null ? 'You' : esc(a.name)}</div><div class="obar"><i style="width:${Math.max(0, 100 * a.hp / a.maxHp)}%"></i></div></div>`; }).join('') + `<span class="round">Round ${cb.round}</span>${run ? '<button class="pilebtn" id="btnCMap" title="Look at the map (M)">Map</button>' : ''}${cb.practice ? '<button class="pilebtn" id="btnCReset" title="Start a fresh fight">Reset</button><button class="pilebtn" id="btnCLeave">Leave</button>' : ''}`;
    const mine = cb.duel ? [p] : cb.players, foes = cb.duel ? cb.players.filter(x => x !== p) : cb.enemies;
    $('playerSlot').className = party && !cb.duel ? 'party' : ''; $('playerSlot').innerHTML = mine.map(unitHtml).join('');
    $('foes').innerHTML = foes.map(unitHtml).join('');
    if (withPops) popups(); else snapshot();
    $('orb').textContent = p.mana;
    $('manaSub').textContent = `max ${p.maxMana} · +${p.regen} per turn`;
    const fat = [...p.drawPile, ...p.hand, ...p.discard].filter(c => CARDS[c.key].type === 'Status').length;
    $('piles').innerHTML = `<button class="pilebtn" data-pile="draw">Draw pile <b>${p.drawPile.length}</b></button><button class="pilebtn" data-pile="discard">Discard <b>${p.discard.length}</b></button><button class="pilebtn" data-pile="exhaust">Exhaust <b>${p.exhaust.length}</b></button><span>Draws <b>${p.draw}</b>/round</span>${fat ? `<span>Status cards <b>${fat}</b></span>` : ''}${cb.pressure() ? `<span>Pressure <b>+${Math.round(cb.pressure() * 100)}%</b></span>` : ''}`;
    const myTurn = cb.phase === 'player' && !cb.over && (cb.myMi == null || cb.current === p);
    $('btnEnd').disabled = !myTurn || busy;
    const hint = $('hint'); hint.classList.remove('alert');
    if (cb.over) hint.textContent = cb.over === 'win' ? 'Victory.' : 'Defeat.';
    else if (!myTurn) hint.innerHTML = `${cb.current ? esc(cb.current.isPlayer ? (party ? cb.current.name : 'You') : cb.current.name) : ''} ${cb.current && cb.current.isPlayer && cb.myMi != null ? 'is taking their turn' : 'acting'}...<span id="tclock"></span>`;
    else if (selected) { hint.textContent = `Choose a target for ${CARDS[selected.key].name} (Esc to cancel).`; hint.classList.add('alert'); }
    else if (cb.myMi != null) hint.innerHTML = `Your turn. Click a card to play it. E ends your turn.<span id="tclock"></span>`;
    else hint.textContent = party ? `${p.name}'s turn. Click a card to play it. E ends ${p.name}'s turn.` : 'Your turn. Click a card to play it. E ends your turn.';
    $('hand').innerHTML = p.hand.map(c => {
      const d0 = cb.card(c), ec = d0.cost != null ? cb.costOf(p, d0, c) : null, d = ec != null && ec !== d0.cost ? Object.assign(Object.create(d0), { cost: ec }) : d0;
      const chk = myTurn ? cb.canPlay(c) : { ok: false, why: cb.over ? 'Fight over' : 'Not your turn' }, face = cardFace(d);
      const n = p.hand.length, k = p.hand.indexOf(c), mid = (n - 1) / 2, rot = (k - mid) * Math.min(5, 26 / Math.max(1, n)), off = Math.abs(k - mid) ** 1.6 * 4;
      if (face) return `<button class="${cardCls(d)} ${selected && selected.uid === c.uid ? 'selected' : ''}" style="${cardVars(d)};--rot:${rot.toFixed(1)};--off:${off.toFixed(1)};--z:${k + 1}" data-uid="${c.uid}" ${chk.ok && !busy ? '' : 'disabled'} title="${chk.ok ? (d.target === 'enemy' ? 'Single enemy' : d.target === 'all' ? 'All enemies' : 'Self') : esc(chk.why)}" aria-label="${esc(d.name + ', ' + d.cost + ' mana: ' + d.text)}">${face}</button>`;
      return `<button class="card ${d.type === 'Status' ? 'status' : ''} ${selected && selected.uid === c.uid ? 'selected' : ''}" style="--rc:${RC[d.rarity]}" data-uid="${c.uid}" ${chk.ok && !busy ? '' : 'disabled'} title="${chk.ok ? '' : esc(chk.why)}">
        ${d.cost != null ? `<span class="cost">${d.cost}</span>` : ''}<span class="cname">${esc(d.name)}</span><span class="ctype">${d.rarity} ${d.type}${d.dtype && d.dtype !== 'Physical' ? ' · ' + d.dtype : ''}</span>
        <span class="ctext">${esc(d.text)}</span><span class="cfoot">${chk.ok ? (d.target === 'enemy' ? 'Single enemy' : d.target === 'all' ? 'All enemies' : 'Self') : esc(chk.why)}</span></button>`;
    }).join('') || `<span class="hint">${myTurn ? 'No cards in hand.' : ''}</span>`;
    fitCards($('hand'));
    if (!$('pCMeter').hidden) renderMeter($('meterC'));
    const logEl = $('log');
    logEl.innerHTML = cb.log.slice(-250).map(l => `<div class="k-${l.kind}">${esc(l.text)}</div>`).join('');
    logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight;
  }

  // ---------- pile viewers
  function cardRows(cards, isEnemy, ordered) {
    if (!cards.length) return '<span class="muted">Empty.</span>';
    if (ordered) return cards.map(c => rowHtml(1, isEnemy ? { name: c.name, cost: c.cost, text: c.text, rarity: 'White', planned: isEnemy && cb.enemies.some(e => e.plan.includes(c.uid)) } : cb.card(c))).join('');
    const groups = new Map();
    for (const c of cards) { const k = isEnemy ? c.name : c.key + '+' + (c.rank || 0); const g = groups.get(k) || { n: 0, c }; g.n++; groups.set(k, g); }
    return [...groups.values()].sort((a, b) => (isEnemy ? a.c.name : cb.card(a.c).name).localeCompare(isEnemy ? b.c.name : cb.card(b.c).name))
      .map(g => rowHtml(g.n, isEnemy ? { name: g.c.name, cost: g.c.cost, text: g.c.text, rarity: 'White' } : cb.card(g.c))).join('');
  }
  function rowHtml(n, d, extra) {
    return `<div class="cardrow" style="--rc:${RC[d.rarity] || 'var(--line)'}"><span class="n">${n}x</span><b>${esc(d.name)}${d.planned === false ? ' <span class="muted">(can\'t afford: discarded)</span>' : ''}</b><span class="cst">${d.cost != null ? d.cost + ' mana' : 'unplayable'}</span><span class="tx">${esc(d.text)}</span></div>`;
  }
  function viewPile(which) {
    const p = hero();
    const title = { draw: 'Draw pile', discard: 'Discard pile', exhaust: 'Exhaust pile' }[which];
    const cards = which === 'draw' ? p.drawPile : which === 'discard' ? p.discard : p.exhaust;
    const note = { draw: 'Sorted by name; the real order is hidden. Your discard pile is shuffled back in when this runs out (adding a Fatigue).', discard: 'Played and discarded cards. Shuffled back into your draw pile when it runs out.', exhaust: 'Removed for the rest of this fight.' }[which];
    const groups = new Map();
    for (const c of cards) { const k = c.key + '+' + (c.rank || 0); const g = groups.get(k) || { n: 0, c }; g.n++; groups.set(k, g); }
    const faces = [...groups.values()].sort((a, b) => cb.card(a.c).name.localeCompare(cb.card(b.c).name)).map(g => { const d = cb.card(g.c); const box = d.type !== 'Status' && cardBox(d, 130); return `<div class="pilecard">${box || rowHtml(1, d)}${g.n > 1 ? `<span class="pilecount">x${g.n}</span>` : ''}</div>`; }).join('');
    modal(`<h2>${title} (${cards.length})</h2><p class="muted">${note} Hover a card to enlarge it.</p><div class="pilegrid">${faces || '<span class="muted">Empty.</span>'}</div><div class="row"><button class="btn primary" id="mClose">Close</button></div>`);
    $('modalBox').classList.add('wide');
    $('mClose').onclick = closeModal;
  }
  function viewEnemy(id) {
    const e = cb.enemies.find(x => x.id === id); if (!e) return;
    const hand = e.hand.map(c => ({ name: c.name, cost: c.cost, text: c.text, rarity: 'White', planned: e.plan.includes(c.uid) }));
    modal(`<h2>${esc(e.name)}</h2><p class="muted">Mana ${e.mana} / ${e.maxMana}, +${cb.effRegen(e)} per turn, draws ${e.draw} a round. Its whole deck is ${e.hand.length + e.drawPile.length + e.discard.length} cards.</p>
      <h3 style="font-size:20px;color:var(--accent)">Hand (${e.hand.length}): what it plays on its next turn, in order</h3>${enemyGrid(e.hand.map(c => ({ c, dim: !e.plan.includes(c.uid), tag: e.plan.includes(c.uid) ? '' : "can't afford" })), e.key, 150)}
      <h3 style="font-size:20px;color:var(--accent)">Draw pile (${e.drawPile.length})</h3><p class="muted" style="margin:0">Sorted by name; the real order is hidden.</p>${enemyGrid(groupEnemyCards(e.drawPile), e.key, 140)}
      <h3 style="font-size:20px;color:var(--accent)">Discard pile (${e.discard.length})</h3>${enemyGrid(groupEnemyCards(e.discard), e.key, 140)}
      <div class="row"><button class="btn primary" id="mClose">Close</button><button class="btn" id="mLoot">Loot table</button></div>`);
    $('modalBox').classList.add('wide'); fitCards($('modalBox'));
    $('mClose').onclick = closeModal; $('mLoot').onclick = () => lootModal(e.key);
  }
  $('piles').addEventListener('click', (ev) => { const b = ev.target.closest('[data-pile]'); if (b) viewPile(b.dataset.pile); });
  $('foes').addEventListener('click', (ev) => { const b = ev.target.closest('[data-enemy]'); if (b) { ev.stopPropagation(); viewEnemy(b.dataset.enemy); } }, true);
  $('modal').addEventListener('click', (ev) => { if (ev.target === $('modal') && $('mClose')) closeModal(); });

  function combatOver() {
    hidePeeks();
    if (cb && cb.duel) { if (!cb._shown) { cb._shown = true; duelOver(); } return; }
    if (cb && cb.practice) { if (!cb._shown) { cb._shown = true; const p = cb.players[0], dmg = cb.enemies.reduce((t, e) => t + (e.maxHp - Math.max(0, e.hp)), 0);
      modal(`<h2>${p.hp > 0 ? 'The dummy is down' : 'You fell over'}</h2><p>${dmg.toLocaleString()} damage in ${cb.round} rounds (${Math.round(dmg / Math.max(1, cb.round)).toLocaleString()} a round). Nothing is lost at the dummy.</p><div class="row"><button class="btn primary" id="mAgain">Go again</button><button class="btn" id="mTown">Back to town</button></div>`);
      $('mAgain').onclick = () => { cb = null; startDummy(); }; $('mTown').onclick = leaveDummy; } return; }
    if (!run || !run.combat) return;
    const result = run.finishCombat();
    if (!result) return;
    if (result.result === 'loss') { show('map'); renderMap(true); return; }
    const g = result.gold, d = result.drops;
    const isBoss = run.over === 'victory';
    if (!run.solo) {
      modal(`<h2>${isBoss ? esc(bossName()) + ' falls' : 'Victory'}</h2><p>Won in ${result.rounds} rounds. Each hero rolled their own loot.</p>
        ${run.members.map((m, i) => run.online && i !== run.myMi ? `<div class="sackhead" style="color:${CC[m.cls]}">${esc(m.name)}: ${m.hp}/${m.stats.maxHp} HP${result.per[i].fell ? ' (fell)' : ''} &middot; ${result.per[i].drops.length} drop${result.per[i].drops.length === 1 ? '' : 's'}, +${result.per[i].gold} gold</div>` : (() => { const r = result.per[i]; return `<div class="sackhead" style="color:${CC[m.cls]}">${esc(m.name)}: ${m.hp}/${m.stats.maxHp} HP${r.fell ? ' (fell: sack lost, back up at half HP)' : ''} &middot; +${r.gold} gold</div><div class="list">${r.drops.map(it => itemHtml(it)).join('') || '<span class="muted">No gear or cards.</span>'}</div>`; })()).join('')}
        <div class="row"><button class="btn primary" id="mBack">${isBoss ? 'See the results' : 'Back to the map'}</button></div>`);
      $('mBack').onclick = () => { closeModal(); show('map'); renderMap(true); };
      return;
    }
    modal(`<h2>${isBoss ? esc(bossName()) + ' falls' : 'Victory'}</h2><p>Won in ${result.rounds} rounds. HP ${run.hp}/${run.maxHp}${run.stats.healthRegen ? ` (incl. ${run.stats.healthRegen} Health Regen)` : ''}, mana ${run.mana} carried into the next fight.</p>
      <p><b>Into the sack:</b> ${g} gold${d.length ? ' and:' : '. No gear or cards dropped.'}</p><div class="list">${d.map(it => itemHtml(it)).join('')}</div>
      <div class="row"><button class="btn primary" id="mBack">${isBoss ? 'See the results' : 'Back to the map'}</button></div>`);
    $('mBack').onclick = () => { closeModal(); show('map'); renderMap(true); };
  }

  // big readable preview of the hovered card
  const peek = document.createElement('div'); peek.className = 'cardpeek'; peek.hidden = true; document.body.appendChild(peek);
  $('hand').addEventListener('mouseover', (ev) => {
    const b = null; if (!b || !cb) { peek.hidden = true; return; }
    const c = hero().hand.find(x => x.uid === b.dataset.uid); if (!c) return;
    peek.innerHTML = cardBox(cb.card(c)); peek.hidden = false;
    const r = b.getBoundingClientRect(), w = 270, h = 405;
    peek.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    peek.style.top = Math.max(8, r.top - h - 12) + 'px';
    fitCards(peek);
  });
  $('hand').addEventListener('mouseleave', () => { peek.hidden = true; });
  $('foes').addEventListener('mouseover', (ev) => {
    const t = ev.target.closest('.intent[data-cu]'); if (!t || !cb) return;
    const e = cb.enemies.find(x => x.id === t.dataset.e), c = e && e.hand.find(x => x.uid === t.dataset.cu); if (!c) return;
    peek.innerHTML = cardBox(enemyCardD(c, e.key)); peek.hidden = false; t.removeAttribute('title');
    const r = t.getBoundingClientRect(), w = 270, h = 405;
    peek.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    peek.style.top = Math.min(innerHeight - h - 8, r.bottom + 10) + 'px';
    fitCards(peek);
  });
  $('foes').addEventListener('mouseout', (ev) => { if (ev.target.closest('.intent[data-cu]') && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('.intent[data-cu]'))) peek.hidden = true; });
  $('hand').addEventListener('click', () => { peek.hidden = true; });
  $('hand').addEventListener('click', (ev) => {
    const b = ev.target.closest('.card, .cf'); if (!b || b.disabled || busy) return;
    const c = hero().hand.find(x => x.uid === b.dataset.uid); if (!c) return;
    const d = CARDS[c.key];
    if (d.target === 'enemy' && cb.alive().length > 1) { selected = (selected && selected.uid === c.uid) ? null : c; render(); return; }
    selected = null; const tgt = cb.alive()[0] && cb.alive()[0].id;
    if (cb.myMi != null) { b.disabled = true; netAct({ t: 'play', uid: c.uid, tgt }); return; }
    cb.play(c.uid, tgt); render(true); if (cb.over) combatOver();
  });
  function pickTarget(id) { if (!selected) return; const c = selected; selected = null; if (cb.myMi != null) { render(); netAct({ t: 'play', uid: c.uid, tgt: id }); return; } cb.play(c.uid, id); render(true); if (cb.over) combatOver(); }
  $('foes').addEventListener('click', (ev) => { const u = ev.target.closest('.unit.targetable'); if (u) pickTarget(u.dataset.id); });
  $('foes').addEventListener('keydown', (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.unit.targetable')) { ev.preventDefault(); pickTarget(ev.target.dataset.id); } });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (ev.cbHandled) return;
      if (selected) { selected = null; render(); return; }
      if (!$('modal').hidden) { if ($('mClose')) closeModal(); return; }
      if (!$('sheet').hidden || !$('talk').hidden) return;
      if (ev.target.matches('input, select, textarea')) return;
      openMenu(); return;
    }
    if ((ev.key === 'm' || ev.key === 'M') && !$('scrCombat').hidden && $('modal').hidden && !ev.target.matches('select, input, textarea') && run) { mapPeek(); return; }
    if ((ev.key === 'e' || ev.key === 'E') && !$('scrCombat').hidden && $('modal').hidden && !ev.target.matches('select, input') && !$('btnEnd').disabled) $('btnEnd').click();
  });
  $('order').addEventListener('click', (ev) => { if (ev.target.closest('#btnCMap')) mapPeek(); if (ev.target.closest('#btnCReset') && cb && cb.practice) { cb = null; startDummy(); } if (ev.target.closest('#btnCLeave') && cb && cb.practice) leaveDummy(); });
  $('btnEnd').addEventListener('click', () => { if (busy || cb.phase !== 'player') return; selected = null; if (cb.myMi != null) { $('btnEnd').disabled = true; netAct({ t: 'end' }); return; } cb.endPlayerTurn(); render(true); pump(); });
  renderHub(); show('title'); connectAccount();
})();
</script>
