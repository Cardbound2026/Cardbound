<meta charset="utf-8">
<title>Cardbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=New+Rocker&family=Grenze:wght@500;600;700&display=swap">
<style>
/* Layout: a war-camp table. Start screen, then a campaign map (read bottom to top) beside a field ledger; fights open the battlefield. Single dark look by choice. */
:root {
  --cf-name: 'New Rocker', 'Pirata One', Georgia, serif; --cf-name-w: 400; --cf-name-s: 1.05; --cf-text: 'Grenze', Georgia, serif; --cf-text-w: 600; --cf-text-s: 1.08;
  --bg: #13100d; --panel: #1d1813; --panel2: #272019; --line: #3b3128; --text: #ede3d0; --muted: #a6978a;
  --accent: #d6a14a; --hp: #c9472f; --block: #7aa7cf; --mana: #5a86e6; --good: #7cc261; --warn: #e2b34a;
  --r-white: #d8d2c4; --r-green: #64b25b; --r-blue: #4f93e6; --r-gold: #e4a93a; --r-purple: #a57be6; --r-status: #6c6258;
  --f-display: "Pirata One", "Georgia", serif; --f-ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 15px; line-height: 1.35; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; max-width: 1400px; margin: 0 auto; display: grid; gap: 12px; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 7px 14px; font-weight: 600; letter-spacing: .03em; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a130a; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 34px; color: var(--accent); line-height: 1; }
.brand span { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* start */
.start { display: grid; gap: 16px; max-width: 980px; margin: 0 auto; width: 100%; }
.start h2 { font-size: 30px; color: var(--accent); }
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.cls { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; border-top: 4px solid var(--cc); }
.cls[aria-pressed="true"] { border-color: var(--accent); background: #2b2115; box-shadow: 0 0 0 1px var(--accent) inset; }
.cls b { font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.cls small { color: var(--muted); font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; }
.field { display: grid; gap: 3px; }
.field label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field select { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.rules { columns: 2 280px; column-gap: 24px; font-size: 14px; color: #d6cab6; }
.rules p { margin: 0 0 8px; break-inside: avoid; }
.rules b { color: var(--text); }

/* town */
.townbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; }
.townbar b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.tbhelp { font-size: 12px; margin-left: auto; }
.townwrap { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0b0907; }
.townwrap canvas { display: block; touch-action: manipulation; cursor: pointer; }
.townwrap canvas:focus { outline: none; }
.prompt { position: absolute; left: 12px; bottom: 12px; background: rgba(13,10,8,.85); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; pointer-events: none; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--muted); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; margin-right: 4px; }
.talk { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); background: linear-gradient(180deg, #241c15, #19140f); border: 2px solid var(--accent); border-radius: 10px; padding: 12px 16px; display: grid; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.talk b { font-family: var(--f-display); font-weight: 400; font-size: 24px; color: var(--accent); }
.talk p { margin: 0; font-size: 16px; color: #e6dac4; }
.talk .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet { position: fixed; inset: 0; background: rgba(8,6,4,.72); z-index: 15; display: grid; place-items: start center; padding: 16px; overflow: auto; }
.sheetbox { width: min(1180px, 100%); background: var(--bg); border: 1px solid var(--accent); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.sheethead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheethead h2 { font-size: 32px; color: var(--accent); }
.sheetgrid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 12px; align-items: start; }
.sheetgrid.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .sheetgrid { grid-template-columns: minmax(0, 1fr); } }
.sheetmain { display: grid; gap: 12px; min-width: 0; }
.camp { display: grid; gap: 10px; }
.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.hero { text-align: left; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--cc); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.hero[aria-selected="true"] { border-color: var(--accent); background: #2b2115; box-shadow: 0 0 0 1px var(--accent) inset; }
.hero b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.hero small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.campgrid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 980px) { .campgrid { grid-template-columns: minmax(0, 1fr); } }
.power { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin: 8px 0; }
.power div { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; }
.power b { display: block; font-family: var(--f-display); font-size: 28px; font-weight: 400; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.power span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-items: start; }
.two h3 { font-family: var(--f-ui); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 2px 0 6px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.list.tall { max-height: 560px; }
.item .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.item .acts .btn { padding: 3px 9px; font-size: 13px; }
.up { color: var(--good); } .down { color: #f0a08c; }
.xpbar { height: 5px; background: #0d0b09; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; background: var(--accent); }
.feedlist { display: grid; gap: 4px; max-height: 300px; overflow: auto; }
.feedlist label { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 4px 8px; background: var(--panel2); border-left: 3px solid var(--rc); border-radius: 4px; font-size: 13px; }
.savenote { font-size: 12px; color: var(--muted); }
.field input[type=range] { width: 100%; accent-color: var(--accent); }

/* run layout */
.runmain { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .runmain { grid-template-columns: minmax(0, 1fr); } }
.mapwrap { position: relative; }
.mapscroll { overflow: auto; max-height: calc(100vh - 170px); min-height: 420px; border-radius: 6px; background: radial-gradient(120% 70% at 50% 100%, #2a2219 0%, #16120e 70%); }
.mapscroll svg { display: block; margin: 0 auto; }
.node { cursor: default; }
.node.reach { cursor: pointer; }
.node.reach circle.ring { stroke: var(--accent); stroke-width: 2.5; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .node.reach circle.ring { animation: none; } }
.node:focus { outline: none; }
.node:focus-visible circle.ring { stroke: #fff; stroke-width: 3; }
.info { margin-top: 10px; min-height: 64px; font-size: 14px; }
.info b { font-size: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.side { display: grid; gap: 10px; min-width: 0; }
.charhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.charhead h3 { font-size: 24px; color: var(--accent); }
.bar { position: relative; height: 18px; background: #0d0b09; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #e0583d, var(--hp)); transition: width .25s; }
.bar span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 16px; text-shadow: 0 1px 2px #000; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin: -4px -4px 8px; }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 4px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.list { display: grid; gap: 6px; max-height: 340px; overflow: auto; }
.item { border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 5px; padding: 6px 8px; background: var(--panel2); font-size: 13px; display: grid; gap: 2px; }
.item .ih { display: flex; justify-content: space-between; gap: 6px; }
.item .ih b { color: var(--rc); font-weight: 700; }
.item .il { color: var(--muted); font-size: 12px; }
.item .st { color: #d6cab6; }
.runlog { font-size: 13px; color: #d6cab6; display: grid; gap: 4px; max-height: 260px; overflow: auto; }

/* battlefield */
.field-panel { background: radial-gradient(120% 90% at 50% 0%, #2a2219 0%, var(--panel) 60%); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.order { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.order .otile { position: relative; width: 98px; padding: 4px 4px 5px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(#1f1915, #15110e); text-align: center; transition: transform .15s, opacity .15s; }
.order .otile.hero { border-color: color-mix(in srgb, var(--oc) 55%, var(--line)); }
.order .otile.foe { border-color: #5a2a20; }
.order .otile .ofig { height: 58px; display: grid; place-items: center; }
.order .otile .ofig svg { height: 58px; width: auto; }
.order .otile .onm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--oc, var(--text)); }
.order .otile .obar { height: 5px; background: #2a1a16; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.order .otile .obar i { display: block; height: 100%; background: var(--hp); }
.order .otile .oini { position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.order .otile.done { opacity: .5; }
.order .otile.dead { opacity: .3; filter: grayscale(1); }
.order .otile.now { transform: translateY(-3px) scale(1.08); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(214,161,74,.45); opacity: 1; }
.order .otile.now::after { content: 'NOW'; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); background: var(--accent); color: #1a1208; font-size: 9px; font-weight: 800; letter-spacing: .1em; padding: 1px 6px; border-radius: 999px; }
.order .osep { color: #5a4a3b; font-size: 16px; }
.intent .itgt { font-weight: 600; font-size: 11px; margin-left: 2px; opacity: .95; }
.order .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; margin-right: 4px; }
.order .chip.now { border-color: var(--accent); color: var(--text); background: #3a2c17; }
.order .chip.dead { text-decoration: line-through; opacity: .5; }
.order .round { margin-left: auto; font-family: var(--f-display); font-size: 22px; color: var(--accent); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.4fr); align-items: end; gap: 12px; min-height: 200px; padding: 0 4px; border-bottom: 1px dashed var(--line); }
.vs { font-family: var(--f-display); color: var(--line); font-size: 30px; align-self: center; }
.foes { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; }
@media (max-width: 640px) { .stage { grid-template-columns: minmax(0, 1fr); } .vs { display: none; } .foes { justify-content: flex-start; } }
.unit { position: relative; width: min(210px, calc(50vw - 30px)); max-width: 100%; display: grid; gap: 6px; border-radius: 8px; padding: 8px; border: 1px solid transparent; }
.unit.active { border-color: var(--accent); background: rgba(214,161,74,.07); }
.unit.dead { opacity: .35; filter: grayscale(1); }
.unit.targetable { cursor: crosshair; border-color: var(--hp); background: rgba(201,71,47,.08); }
.unit.targetable:hover { background: rgba(201,71,47,.18); }
.figure { height: 80px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.figure svg { height: 80px; width: auto; max-width: 100%; display: block; }
.uname { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.uname b { font-size: 16px; font-weight: 700; }
.uname small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; }
.tag { font-size: 12px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag.block { border-color: var(--block); color: var(--block); font-weight: 700; }
.tag.bad { border-color: #8a3a2c; color: #f0a08c; }
.tag.good { border-color: #47703a; color: #a8dc8f; }
.intents { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; }
.intent { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: #2d1d17; border: 1px solid #6a3324; color: #ffbaa6; font-variant-numeric: tabular-nums; }
.intent.defend { background: #172430; border-color: #35546d; color: #a9cdec; }
.intent.debuff { background: #272033; border-color: #5a4a78; color: #cdb9f2; }
.intent.buff { background: #2b2614; border-color: #6b5a26; color: #f0d58b; }
.intent.skip { opacity: .45; text-decoration: line-through; }
.intent svg { width: 13px; height: 13px; }
.pop { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); font-family: var(--f-display); font-size: 30px; pointer-events: none; animation: pop 1.1s ease-out forwards; text-shadow: 0 2px 4px #000; }
.pop.dmg { color: #ff7b5c; } .pop.blk { color: var(--block); } .pop.heal { color: var(--good); }
@keyframes pop { from { opacity: 1; transform: translate(-50%, 0) scale(1.15); } to { opacity: 0; transform: translate(-50%, -38px) scale(.9); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; opacity: 0; } }
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px 18px; }
.mana { display: flex; align-items: center; gap: 8px; }
.orb { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #a7c3ff, var(--mana) 45%, #1d2f66 100%); box-shadow: 0 0 0 2px #0d0b09, 0 0 0 3px var(--line); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.mana small { color: var(--muted); font-size: 12px; display: block; }
.piles { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.piles b { color: var(--text); }
.hud .spacer { display: none; }
.hint { color: var(--muted); font-size: 13px; min-height: 18px; }
.hint.alert { color: var(--warn); }
.hand { display: flex; justify-content: center; align-items: flex-end; padding: 18px 8px 4px; min-height: 0; overflow: visible; }
.card { flex: 0 0 136px; height: 186px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px; text-align: left; padding: 8px 9px; border-radius: 8px; background: linear-gradient(180deg, #2f271f, #211b15); border: 1px solid var(--line); border-top: 4px solid var(--rc); position: relative; transition: transform .12s, border-color .12s; }
.card:hover:not(:disabled) { transform: translateY(-6px); border-color: var(--rc); }
.card.selected { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 6px 18px rgba(214,161,74,.25); }
.card:disabled { opacity: .45; cursor: not-allowed; }
.card .cost { position: absolute; top: -10px; left: -6px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--mana); border: 2px solid #0d0b09; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.card .cname { font-weight: 700; font-size: 15px; line-height: 1.1; padding-left: 18px; }
.card .ctype { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--rc); }
.card .ctext { font-size: 12.5px; color: #d9cdb8; overflow: hidden; }
.card .cfoot { font-size: 11px; color: var(--muted); }
.card.status { background: repeating-linear-gradient(135deg, #221d19 0 8px, #1c1814 8px 16px); }
.pilebtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; color: var(--muted); font-size: 13px; }
.pilebtn:hover { border-color: var(--accent); color: var(--text); }
.pilebtn b { color: var(--text); }
.deckbtn { font-size: 12px; justify-self: start; }
.cardlist { display: grid; gap: 4px; }
.cardrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 8px; border-left: 3px solid var(--rc); background: var(--panel2); border-radius: 4px; font-size: 13px; }
.cardrow b { font-weight: 700; }
.cardrow .n { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.cardrow .cst { color: var(--mana); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cardrow .tx { grid-column: 2 / 4; color: #d6cab6; }
.endturn { font-family: var(--f-display); font-size: 22px; font-weight: 400; padding: 6px 22px; }
.combatmain { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .combatmain { grid-template-columns: minmax(0, 1fr); } }
.ledger { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 120px); min-height: 380px; }
@media (max-width: 980px) { .ledger { max-height: 460px; } }
.pane { overflow: auto; padding: 4px 4px; min-height: 0; }
.log { font-family: var(--f-mono); font-size: 12px; line-height: 1.45; display: grid; gap: 3px; }
.log div { padding-left: 8px; border-left: 2px solid transparent; overflow-wrap: anywhere; }
.log .k-round { font-family: var(--f-display); font-size: 18px; color: var(--accent); border: 0; padding: 8px 0 2px; }
.log .k-sys { color: var(--muted); } .log .k-card { color: #f2e6cf; border-left-color: var(--accent); } .log .k-player { color: #d7cbb6; }
.log .k-enemy { color: #f0b4a3; } .log .k-crit { color: var(--warn); } .log .k-heal { color: var(--good); } .log .k-dot { color: #e58d7a; }
.log .k-kill, .log .k-win { color: var(--good); font-weight: 500; } .log .k-loss { color: #ff8a6e; font-weight: 500; }


/* framed cards: class frame image, rarity gem, text drawn live on top */

.classpick button[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: #2b2115; }
.classpick button:disabled { opacity: .45; }
.classpick b { font-family: var(--cf-name); font-weight: 400; font-size: 22px; }
.classpick span { font-size: 13px; color: #d6cab6; } .classpick small { font-size: 12px; color: var(--muted); }
.namerow { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 12px; }
.namerow input, .menu input { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; color: var(--text); font: inherit; font-size: 16px; min-width: 220px; }
.menu { display: grid; gap: 8px; }
.menu .btn { text-align: left; padding: 10px 14px; }
.menu label.toggle { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.cardpeek { position: fixed; z-index: 12; pointer-events: none; filter: drop-shadow(0 14px 28px rgba(0,0,0,.75)); }
.cardpeek .cf { --cw: 270px; }
@media (hover: none) { .cardpeek { display: none; } }
.hand .cf:disabled { filter: grayscale(.85) brightness(.6); cursor: not-allowed; }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-items: start; }
.cardgrid .dcard { display: grid; gap: 4px; justify-items: center; }
.cardgrid .dcard .cf { --cw: 150px; }
.cardgrid .acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.cardgrid .acts .btn { padding: 3px 8px; font-size: 12px; }
.cardgrid .il { font-size: 11.5px; color: var(--muted); text-align: center; }
.cardgrid .xpbar { width: 150px; }

/* modal */
.modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,6,4,.74); z-index: 20; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 20px 22px; width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; display: grid; gap: 12px; }
.modal h2 { font-size: 38px; color: var(--accent); }
.modal h2.loss { color: var(--hp); }
.modal p { margin: 0; color: #d6cab6; }
.modal .row { display: flex; gap: 10px; flex-wrap: wrap; }
.shop { display: grid; gap: 8px; }

<script>
(function () {
  'use strict';
  const CB = window.CB, CBHub = window.CBHub, { CARDS, CLASSES } = CB, { Run, ROWS, COLS, SHRINES, SLOTS } = window.CBRun, DATA = window.CB_DATA;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const RC = { Codex: '#e0802a', White: 'var(--r-white)', Green: 'var(--r-green)', Blue: 'var(--r-blue)', Gold: 'var(--r-gold)', 'Purple (Epic)': 'var(--r-purple)', Status: 'var(--r-status)', Token: 'var(--muted)' };
  const CC = { Warrior: '#c9472f', Rogue: '#64b25b', Mage: '#4f93e6', Paladin: '#e4a93a' };
  const ICON = {
    attack: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 14l1.2-3.6L11 2.6 13.4 5 5.6 12.8z"/><path d="M10 1.5h4.5V6z"/></svg>',
    defend: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l6 2.2v4.3c0 3.6-2.6 6.3-6 7.5C4.6 13.8 2 11.1 2 7.5V3.2z"/></svg>',
    debuff: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="6"/><rect x="4" y="7" width="8" height="2" fill="#272033"/></svg>',
    buff: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2 5h5l-4 3 1.5 5L8 11l-4.5 3L5 9 1 6h5z"/></svg>',
  };
  const NODE = {
    fight: { color: '#b9a48c', label: 'Fight', path: 'M-7 6l9-9 2 2-9 9zM7 6l-9-9-2 2 9 9z' },
    elite: { color: '#e06a4a', label: 'Elite', path: 'M-9-8l5 6h8l5-6-2 10-4 6h-6l-4-6z' },
    rest: { color: '#e2b34a', label: 'Rest / extract', path: 'M0-8c3 4 6 6 3 11-1 2-5 2-6 0-3-5 3-7 3-11zM-8 7h16v2h-16z' },
    shrine: { color: '#9fd0ff', label: 'Shrine', path: 'M0-9l6 9-6 9-6-9z' },
    merchant: { color: '#7cc261', label: 'Merchant', path: 'M-6-2h12l-2 10h-8zM-3-2c0-6 6-6 6 0' },
    boss: { color: '#ff5a3c', label: 'Boss', path: 'M-10 6l2-12 5 6 3-9 3 9 5-6 2 12z' },
  };
  let profile = null, lastResult = null, run = null, cb = null, selected = null, busy = false, lastHp = {}, lastBlock = {}, chosenCls = 'Warrior', focusNode = null;

  // ---------- camp (hub): saved profile, characters, gear and stash, deck and cards, the Wagon
  const LS = 'cb-profile-v1';
  let supa = null, supaUser = null;
  let heroCls = 'Warrior', storeKind = 'local', dbRef = null, saving = Promise.resolve(), saveQueued = false, hubTab = 'hGear';
  const RAR_ORDER = { Gold: 0, Blue: 1, Green: 2, White: 3 };
  const rarName = r => r === 'Purple (Epic)' ? 'Purple' : r;

  function renderSaveNote() {
    if (!$('scrStart').hidden) $('topInfo').textContent = storeKind === 'cloud' ? 'Progress saves to your account' : storeKind === 'account' ? 'Progress saves to your Claude account' : supa ? 'Not signed in: progress saves in this browser only' : 'Progress saves in this browser';
  }
  function save() {
    profile.savedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(profile)); } catch (e) {}
    if (dbRef && !saveQueued) {
      saveQueued = true;
      saving = saving.then(async () => { saveQueued = false; try { await dbRef.set({ json: JSON.stringify(profile), savedAt: profile.savedAt }); storeKind = supaUser ? 'cloud' : 'account'; } catch (e) { storeKind = 'local'; } renderSaveNote(); });
    }
    renderSaveNote();
  }
  function loadLocal() { let p = null; try { p = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {} profile = CBHub.fix(p); heroCls = profile.last.cls || 'Warrior'; }
  // ---------- accounts and cloud saves (Supabase), when the game runs on its own site
  async function connectSupabase() {
    const C = window.CB_CONFIG;
    supa = window.supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });
    // browsers pause timers in background tabs, so the automatic token renewal can be missed: check again whenever the game is looked at, and every 10 minutes
    const renew = () => { if (supa && supaUser) supa.auth.getSession().catch(() => {}); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) renew(); });
    window.addEventListener('focus', renew); window.addEventListener('online', renew); setInterval(renew, 10 * 60 * 1000);
    supa.auth.onAuthStateChange((ev, session) => {
      if (session && (!supaUser || supaUser.id !== session.user.id)) attachSupaUser(session.user);
      if (!session && supaUser) { socStop(); supaUser = null; dbRef = null; storeKind = 'local'; renderAccount(); renderSaveNote(); }
    });
    const { data } = await supa.auth.getSession();
    if (data && data.session) await attachSupaUser(data.session.user); else { renderAccount(); renderSaveNote(); }
  }
  async function attachSupaUser(u) {
    supaUser = u; renderAccount();
    try {
      const { data: row, error } = await supa.from('profiles').select('data').eq('user_id', u.id).maybeSingle();
      if (error) throw error;
      // a sign-in token lasts an hour; if it lapsed (laptop asleep, tab in the background), renew it and try the save once more
      const up = (o) => supa.from('profiles').upsert({ user_id: u.id, data: JSON.parse(o.json), updated_at: new Date(o.savedAt).toISOString() });
      dbRef = { set: async (o) => { let { error: e } = await up(o); if (e && /jwt|expired|token/i.test(e.message || '')) { await supa.auth.refreshSession(); ({ error: e } = await up(o)); } if (e) throw e; } };
      storeKind = 'cloud';
      if (row && row.data) { const remote = CBHub.fix(row.data); if ((remote.savedAt || 0) > (profile.savedAt || 0)) { profile = remote; heroCls = profile.last.cls || heroCls; } }
      if (!run) { renderHub(); if (!$('scrTitle').hidden) renderTitle(); }
      save();
    } catch (e) { dbRef = null; storeKind = 'local'; toast('Signed in, but your online save could not be reached (' + (e.message || e) + '). Progress keeps saving in this browser.'); }
    renderAccount(); renderSaveNote(); socStart();
  }
  function acctName(u) { const m = (u && u.user_metadata) || {}; return (m.custom_claims && m.custom_claims.global_name) || m.full_name || m.name || m.user_name || (u && u.email) || 'Signed in'; }
  async function signInDiscord() {
    const { error } = await supa.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } });
    if (error) toast('Discord sign-in could not start: ' + error.message);
  }
  function renderAccount() {
    const el = $('acct'); if (!el) return;
    if (!supa) { el.innerHTML = ''; return; }
    el.innerHTML = supaUser ? `<span class="chip" title="Signed in">${esc(acctName(supaUser))}</span> <button class="pilebtn" id="btnSignOut">Sign out</button>` : `<button class="btn primary" id="btnSignIn" style="padding:4px 12px">Sign in to save online</button>`;
    if ($('btnSignIn')) $('btnSignIn').onclick = signInModal;
    if ($('btnSignOut')) $('btnSignOut').onclick = async () => { await supa.auth.signOut(); };
    if (!$('scrTitle').hidden) renderTitle();
  }
  function signInModal() {
    modal(`<h2>Sign in</h2><p>Your heroes, stash and decks then follow you to any device, and you can chat and form parties with friends.</p>
      <button class="btn primary" id="siDiscord" style="background:#5865F2;border-color:#5865F2;color:#fff;justify-self:start;padding:10px 18px">Sign in with Discord</button>
      <p class="muted" style="margin-top:6px">Or get a sign-in link by email (no password):</p>
      <div class="field"><label for="siEmail">Email</label><input id="siEmail" type="email" autocomplete="email" style="background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;color:var(--text);font:inherit"></div>
      <p id="siMsg" class="muted"></p>
      <div class="row"><button class="btn primary" id="siSend">Email me a link</button><button class="btn" id="mClose">Cancel</button></div>`);
    $('mClose').onclick = closeModal; $('siDiscord').onclick = signInDiscord;
    const send = async () => {
      const email = $('siEmail').value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) { $('siMsg').textContent = 'Enter a valid email address.'; return; }
      let last = 0; try { last = +localStorage.getItem('cb-signin-sent') || 0; } catch (e) {}
      const wait = Math.ceil((last + 60000 - Date.now()) / 1000);
      if (wait > 0) { $('siMsg').textContent = `A link was just sent. Check your inbox (and spam), or try again in ${wait} seconds.`; return; }
      $('siSend').disabled = true; $('siMsg').textContent = 'Sending...';
      const { error } = await supa.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) {
        const m = (error.message || '').toLowerCase();
        $('siMsg').textContent = /rate limit|too many/.test(m) ? 'Too many sign-in emails were sent recently. The free email service only allows a few per hour, so wait a while and try again. The newest link you received still works.' : /after \d+ seconds|security purposes/.test(m) ? 'Please wait a minute before asking for another link.' : 'Could not send the link: ' + error.message;
        $('siSend').disabled = false; return;
      }
      try { localStorage.setItem('cb-signin-sent', String(Date.now())); } catch (e) {}
      $('siMsg').textContent = `Link sent to ${email}. Open it on this device to sign in (check spam too). You can close this.`;
    };
    $('siSend').onclick = send; $('siEmail').onkeydown = (e) => { if (e.key === 'Enter') send(); };
  }
  async function connectAccount() {
    try {
      if (window.CB_CONFIG && window.supabase && window.supabase.createClient) return await connectSupabase();
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      const ref = db.doc('data/users/' + id + '/profile');
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
      dbRef = ref; storeKind = 'account';
      if (snap.exists) { const d = snap.data(); const remote = CBHub.fix(JSON.parse(d.json)); if ((remote.savedAt || 0) > (profile.savedAt || 0)) { profile = remote; heroCls = profile.last.cls || heroCls; } }
      if (!run) { renderHub(); if (!$('scrTitle').hidden) renderTitle(); }
      save();
    } catch (e) { dbRef = null; storeKind = 'local'; renderSaveNote(); }
  }

  function heroTabs() {
    $('heroes').innerHTML = Object.keys(CLASSES).filter(k => profile.chars[k]).map(k => {
      const c = profile.chars[k];
      const sub = c ? `Power ${CBHub.powerLevel(c)} &middot; gear ${CBHub.gearScore(c)} &middot; deck ${CB.deckLevel(c.deck)}` : 'New character';
      return `<button class="hero" role="tab" style="--cc:${CC[k]}" data-cls="${k}" aria-selected="${k === heroCls}"><b>${esc(c.name)}</b><small>${k} &middot; ${sub}</small></button>`;
    }).join('') + (Object.keys(profile.chars).length < 4 ? `<button class="hero" style="--cc:var(--line)" id="heroNew"><b>+ New hero</b><small>Create one on the hero screen</small></button>` : '');
  }
  $('heroes').addEventListener('click', (ev) => { if (ev.target.closest('#heroNew')) { $('sheet').hidden = true; show('title'); openCreate(); return; } const b = ev.target.closest('.hero'); if (!b) return; heroCls = b.dataset.cls; CBHub.char(profile, heroCls); profile.last.cls = heroCls; save(); renderHub(); });

  function renderHub() {
    if (!profile.chars[heroCls]) { const k = Object.keys(profile.chars)[0]; if (!k) return; heroCls = k; }
    const c = CBHub.char(profile, heroCls), s = CB.sumGear(c.gear), dl = CB.deckLevel(c.deck), gs = CBHub.gearScore(c);
    heroTabs();
    $('hubChar').innerHTML = `<div class="charhead"><h3>${esc(c.name)} <span class="muted" style="font-size:15px">${heroCls}</span></h3><span class="chip">Gold ${profile.gold}</span></div>
      <div class="power"><div><b>${gs}</b><span>Gear score</span></div><div><b>${dl}</b><span>Deck level</span></div><div><b>${CBHub.powerLevel(c)}</b><span>Power</span></div></div>
      <dl class="kv"><dt>Max HP</dt><dd>${s.maxHp}</dd><dt>Mana</dt><dd>${s.maxMana} max, +${s.regen}/turn</dd><dt>Draw per round</dt><dd>${s.draw}</dd>
      <dt>Strength / Intelligence</dt><dd>+${s.strength}% / +${s.intelligence}%</dd><dt>Dexterity (${CLASSES[heroCls].defense})</dt><dd>+${s.dexterity + s.defGain}%</dd>
      <dt>Crit</dt><dd>${s.crit}% x${s.critMult.toFixed(2)}</dd><dt>Initiative</dt><dd>${s.init}</dd>
      <dt>Runs / best row / boss kills</dt><dd>${c.runs} / ${c.best > ROWS ? 'Boss' : c.best} / ${c.bossKills}</dd></dl>
      <p class="savenote" style="margin:8px 0 0">Gear score is the average item level of your 13 slots. Deck level is your best 20 cards against a perfect +10 deck. Power is the average of the two (0 to 100).</p>`;
    const chk = CBHub.deckCheck(c.deck), lvl = profile.last.level || 0, mk = curMap(), M = DATA.maps[mk], amLead = !onlineParty() || SOC.party.leader === SOC.me;
    $('hubWagon').innerHTML = `<h3 style="font-size:24px;color:var(--accent)">The Wagon</h3>
      <div class="mappick">${Object.values(DATA.maps).map(m => `<button class="mapchip${m.key === mk ? ' on' : ''}" data-map="${m.key}" style="--ec:${ELC[m.element]}" ${amLead ? '' : 'disabled'}><b>${m.num}. ${esc(m.name)}</b><small>${m.element} &middot; boss ${esc(DATA.enemies[m.boss].name)}</small></button>`).join('')}</div>
      <p class="savenote" style="margin:4px 0 0">${mapBlurb(mk)}</p>
      <div class="field" style="margin:8px 0"><label for="selLevel">Map ${M.num}: ${esc(M.name)} &middot; level <b id="lvlOut">+${lvl}</b></label><input type="range" id="selLevel" min="0" max="19" step="1" value="${lvl}"></div>
      <p class="savenote" id="lvlInfo"></p>
      ${onlineParty() ? onlineWagonHtml() : `<fieldset class="partypick"><legend>Party (play them all yourself, in Initiative order)</legend>${Object.keys(CLASSES).filter(k => profile.chars[k]).map(k => `<label><input type="checkbox" data-party="${k}" ${k === heroCls ? 'checked disabled' : (profile.last.party || []).includes(k) ? 'checked' : ''}> ${esc(profile.chars[k].name)} <span class="muted">(${k})</span></label>`).join('')}</fieldset>
      <p class="savenote" id="partyNote" style="margin:4px 0 0"></p>`}
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn primary" id="btnStart" ${chk.ok && (!onlineParty() || SOC.party.leader === SOC.me) ? '' : 'disabled'}>${onlineParty() ? (SOC.party.leader === SOC.me ? `Set out with the party (${SOC.party.members.length})` : 'Waiting for the leader') : 'Set out'}</button></div>
      ${chk.ok ? '' : `<p class="down" style="margin:6px 0 0;font-size:13px">Fix your deck first: it ${chk.problems.join(', ')}.</p>`}
      <p class="savenote" style="margin:8px 0 0">Equipped gear and your deck are safe. Only the loot sack is at risk: die and it's gone. Extract at the row-7 campfire (there's always one) to keep 75%, at any later campfire to keep half, or kill the boss to keep it all. Anything you order from a merchant is paid from the bank and waits in your stash, even if you die.</p>
      <details style="margin-top:8px;font-size:13px;color:#d6cab6"><summary style="cursor:pointer;color:var(--text);font-weight:600">How a run works</summary>
      <p><b>The map:</b> 14 rows, then the map's boss. Every node and its enemies are visible. Rows 1 to 4 are tier 1, 5 to 9 tier 2, 10 to 14 tier 3; elites appear from row 5.</p>
      <p><b>HP and mana carry over</b> between fights. Campfires heal 30% of max HP or let you extract. Shrines buff the next 2 fights. Merchants take orders paid from your banked gold and deliver them to your stash in town.</p>
      <p><b>Fights:</b> draw 4 a round, 20 mana regen. Enemies draw their next hand when their turn ends, so you see what they'll do. Enemy Block resets each enemy turn; half of yours carries over. Every hit's math is in the combat log.</p>
      <p><b>Loot:</b> kills drop gear, cards and gold into the sack. Cards come home to your collection; feed spares into deck cards to rank them up.</p></details>`;
    const lvlInfo = () => { const l = +$('selLevel').value; $('lvlOut').textContent = '+' + l; $('lvlInfo').textContent = `Enemy HP x${Math.pow(1.5, l).toFixed(l > 5 ? 0 : 2)}, damage x${Math.pow(1.3, l).toFixed(l > 5 ? 1 : 2)}. Drops roll around item level ${Math.max(1, 5 * l)} to ${5 * l + 5}.`; };
    $('selLevel').oninput = () => { lvlInfo(); profile.last.level = +$('selLevel').value; };
    $('selLevel').onchange = () => save();
    lvlInfo();
    $('btnStart').onclick = startRun;
    $('hubWagon').querySelectorAll('[data-map]').forEach(b => b.onclick = () => { profile.last.map = b.dataset.map; save(); renderHub(); });
    const partyNote = () => { const n = 1 + $('hubWagon').querySelectorAll('[data-party]:checked:not(:disabled)').length; $('partyNote').textContent = n > 1 ? `Party of ${n}: enemies get +${Math.round(85 * (n - 1))}% HP, mana and regen and draw ${n - 1} more card${n > 2 ? 's' : ''}. Every hero rolls their own loot; one who falls loses their sack and gets up at half HP.` : 'Solo run. Tick more heroes to bring a party.'; };
    if ($('partyNote')) { $('hubWagon').querySelector('.partypick').addEventListener('change', partyNote); partyNote(); }
    renderGearTab(c); renderDeckTab(c); renderLogTab(); renderShopTab(c);
    renderSaveNote(); renderTownBar(); if (!$('sheet').hidden) fitCards($('sheet'));
  }

  // an online party (2+ players) rides out together from the leader's Wagon
  function onlineParty() { return typeof SOC !== 'undefined' && socOn() && SOC.party && SOC.party.members.length > 1; }
  function onlineWagonHtml() {
    const pt = SOC.party, lead = pt.members.find(m => m.uid === pt.leader);
    return `<div class="partypick" style="padding:8px 10px"><b>Online party</b> &middot; ${pt.members.map(m => `<span style="color:${CC[m.cls] || 'var(--text)'}">${esc(m.name)}</span>${m.uid === pt.leader ? ' <span class="muted">(leader)</span>' : ''}`).join(', ')}
      <p class="savenote" style="margin:4px 0 0">${pt.leader === SOC.me ? 'You pick the map level and set out; everyone comes along.' : `${esc(lead ? lead.name : 'The leader')} picks the level and sets out; you'll ride along automatically.`} Each player brings their own hero, gear and deck and controls only that hero. The party votes on every step of the map (ties go to a coin flip). Enemies get +85% HP, mana and regen per extra hero. Everyone takes their own loot home.</p></div>`;
  }
  // ---------- maps: six of them, each with its own element, enemies, boss and the resistance its gear rolls
  const ELC = { Physical: '#c9c2b2', Fire: '#ff7a3c', Frost: '#7fd3ff', Nature: '#7fd36a', Arcane: '#c48bff', Shadow: '#9a8cb8' };
  function curMap() { const k = profile.last.map; return DATA.maps[k] ? k : 'physical'; }
  function mapBlurb(mk) {
    const M = DATA.maps[mk], prev = Object.values(DATA.maps).find(m => m.dropResist === M.element);
    return M.dmgScale ? `${esc(M.theme || '')} Enemies hit ${Math.round((M.dmgScale - 1) * 100)}% harder than on the Broken March${prev && prev.key !== mk ? `: bring ${M.element} Resistance, which gear from ${esc(prev.name)} rolls` : ''}.` : `${esc(M.theme || '')} The starting road.`;
  }
  function bossName(r) { r = r || run; const M = DATA.maps[(r && r.mapKey) || 'physical']; return M ? DATA.enemies[M.boss].name.split(',')[0].replace(/ of the .*/, '') : 'the boss'; }
  function startRun() {
    const lvl = +$('selLevel').value, mk = curMap();
    if (onlineParty()) { if (SOC.party.leader !== SOC.me) return; profile.last.level = lvl; save(); $('sheet').hidden = true; netStart('run', SOC.party.members.map(m => m.uid), lvl, mk); return; }
    const extra = [...$('hubWagon').querySelectorAll('[data-party]:checked:not(:disabled)')].map(x => x.dataset.party);
    const party = [heroCls, ...extra];
    for (const k of extra) { const d = CBHub.deckCheck(CBHub.char(profile, k).deck); if (!d.ok) return toast(`${k}'s deck ${d.problems.join(', ')}. Fix it at the Scribe first.`); }
    profile.last = { cls: heroCls, level: lvl, party: extra, map: mk }; save(); $('sheet').hidden = true;
    const base = party.length > 1 ? CBHub.partyOpts(profile, party) : CBHub.runOpts(profile, heroCls);
    run = new Run(Object.assign(base, { level: lvl, map: mk, seed: Math.floor(Math.random() * 2147483646) + 1, data: DATA }));
    show('map'); renderMap(true);
  }

  // ---------- character screen (C): paperdoll on the left, deck or stash on the right
  const GT = { tab: 'deck', sort: 'cost' };
  const TYPE_ORDER = { Attack: 0, Skill: 1, Power: 2 };
  function deckPanel(c) {
    const chk = CBHub.deckCheck(c.deck), n = chk.counts;
    const costOf = (k) => { const v = CB.rankedCard(k.key, k.rank || 0); return v.cost != null ? v.cost : CARDS[k.key].cost; };
    // stack identical cards (same card, same rank)
    const groups = new Map(); for (const k of c.deck) { const g = k.key + '|' + (k.rank || 0); if (!groups.has(g)) groups.set(g, { k, n: 0 }); groups.get(g).n++; }
    const by = { cost: (a, b) => costOf(a.k) - costOf(b.k), rarity: (a, b) => RAR_ORDER[CARDS[b.k.key].rarity] - RAR_ORDER[CARDS[a.k.key].rarity], type: (a, b) => (TYPE_ORDER[CARDS[a.k.key].type] ?? 3) - (TYPE_ORDER[CARDS[b.k.key].type] ?? 3), name: () => 0 }[GT.sort];
    const list = [...groups.values()].sort((a, b) => by(a, b) || CARDS[a.k.key].name.localeCompare(CARDS[b.k.key].name) || (b.k.rank || 0) - (a.k.rank || 0));
    const types = {}; for (const k of c.deck) { const t = CARDS[k.key].type; types[t] = (types[t] || 0) + 1; }
    const avg = c.deck.length ? c.deck.reduce((t, k) => t + costOf(k), 0) / c.deck.length : 0;
    const B = [['0', x => x === 0], ['10', x => x > 0 && x <= 10], ['20', x => x > 10 && x <= 20], ['30', x => x > 20 && x <= 30], ['40+', x => x > 30]];
    const curve = B.map(([l, f]) => [l, c.deck.filter(k => f(costOf(k))).length]), top = Math.max(1, ...curve.map(x => x[1]));
    const ranked = c.deck.filter(k => k.rank).length;
    return `<div class="deckhead">
        <div class="dstats">
          <div><b>${c.deck.length}</b><span>cards (${CB.DECK_MIN}-${CB.DECK_MAX})</span></div>
          <div><b>${avg.toFixed(1)}</b><span>avg mana</span></div>
          <div><b>${CB.deckLevel(c.deck)}</b><span>deck level</span></div>
        </div>
        <div class="curve" role="img" aria-label="Mana curve: ${curve.map(([l, v]) => `${v} at ${l}`).join(', ')}">${curve.map(([l, v]) => `<div><i style="height:${Math.round(100 * v / top)}%"></i><b>${v || ''}</b><span>${l}</span></div>`).join('')}</div>
      </div>
      <p class="dline"><span style="color:${RC.Gold}">${n.Gold}/2 Gold</span> &middot; <span style="color:${RC.Blue}">${n.Blue}/4 Blue</span> &middot; <span style="color:${RC.Green}">${n.Green}/6 Green</span> &middot; ${n.White} White
        <span class="muted">&nbsp;|&nbsp; ${['Attack', 'Skill', 'Power'].filter(t => types[t]).map(t => `${types[t]} ${t}${types[t] > 1 ? 's' : ''}`).join(' &middot; ')}${ranked ? ` &middot; ${ranked} ranked up` : ''}</span></p>
      ${chk.ok ? '' : `<p class="down" style="margin:0 0 6px;font-size:13px">Deck ${chk.problems.join(', ')}. Fix it at the Scribe before you ride out.</p>`}
      <div class="dtools"><div class="cxchips" role="group" aria-label="Sort">${[['cost', 'Mana'], ['type', 'Type'], ['rarity', 'Rarity'], ['name', 'Name']].map(([k, l]) => `<button class="cxchip ${GT.sort === k ? 'on' : ''}" data-gsort="${k}">${l}</button>`).join('')}</div>
        <button class="btn" id="btnScribe" style="padding:4px 10px;font-size:13px">Edit deck${c.cards.length ? ` (${c.cards.length} in collection)` : ''}</button></div>
      <div class="pilegrid deckgrid">${list.map(({ k, n }) => { const v = CB.rankedCard(k.key, k.rank || 0); return `<div class="pilecard" data-dcard="${k.id}" title="Click to upgrade">${cardBox(Object.assign({}, CARDS[k.key], v), 120)}${n > 1 ? `<span class="pilecount">x${n}</span>` : ''}${k.rank ? `<span class="pilecount rk">+${k.rank}</span>` : ''}</div>`; }).join('')}</div>
      <p class="muted" style="font-size:12px;margin:0">Hover a card to read it, click it to rank it up. Adding and removing cards happens at the Scribe.</p>`;
  }
  function renderGearTab(c) {
    const eq = CBHub.SLOTS.map(sl => { const it = c.gear.find(g => g.slot === sl); return it ? itemHtml(it, `<div class="acts"><button class="btn" data-unequip="${sl}">Unequip</button></div>`) : `<div class="item" style="--rc:var(--line)"><span class="muted">${sl}: empty</span></div>`; }).join('');
    const st = profile.stash.map(it => {
      const opts = CBHub.slotOptions(it);
      const cur = opts.map(sl => c.gear.find(g => g.slot === sl)).filter(Boolean);
      const vs = cur.length ? cur.map(g => { const d = (it.ilvl || 0) - (g.ilvl || 0); return `${esc(g.name)} ilvl ${g.ilvl} <span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">(${d > 0 ? '+' : ''}${d})</span>`; }).join(', ') : 'an empty slot';
      const btns = opts.length > 1 ? opts.map(sl => `<button class="btn" data-equip="${it.id}" data-slot="${sl}">Equip as ${sl}</button>`).join('') : `<button class="btn" data-equip="${it.id}">Equip</button>`;
      return itemHtml(it, `<div class="il">${upBadge(it, c.gear)} Replaces ${vs}</div><div class="acts">${btns}<button class="btn" data-salvage="${it.id}">Salvage +${CBHub.salvageValue(it)} gold</button></div>`);
    }).join('');
    const multi = Object.keys(profile.chars).length > 1;
    const heroRow = multi ? `<div class="cxchips" role="tablist" aria-label="Hero" style="margin:0 0 8px">${Object.keys(CLASSES).filter(k => profile.chars[k]).map(k => `<button class="cxchip ${k === heroCls ? 'on' : ''}" data-hero="${k}"><b style="color:${CC[k]}">${esc(profile.chars[k].name)}</b> <span class="muted">${k}</span></button>`).join('')}</div>` : '';
    $('hpGear').innerHTML = `${heroRow}<div class="gearwrap"><div>${paperdoll(c, heroCls, { own: true })}<p class="muted" style="font-size:12px;margin:6px 0 0">Hover a slot for the item, click it to swap or unequip.</p></div>
      <div class="gearside"><div class="tabs gtabs" role="tablist"><button role="tab" data-gtab="deck" aria-selected="${GT.tab === 'deck'}">Deck ${c.deck.length}</button><button role="tab" data-gtab="stash" aria-selected="${GT.tab === 'stash'}">Stash ${profile.stash.length} / ${CBHub.STASH_MAX}</button></div>
      ${GT.tab === 'deck' ? deckPanel(c) : `<p class="muted" style="font-size:12px;margin:0 0 6px">Shared by all heroes.</p><div class="list tall">${st || '<span class="muted">Empty. Gear you bring home from a run lands here. Unequipped gear goes here too.</span>'}</div>`}</div></div>`;
    fitCards($('hpGear'));
    paintPortraits($('hpGear'));
  }
  $('hpGear').addEventListener('click', (ev) => {
    const pc = ev.target.closest('[data-dcard]'); if (pc) return upgradeModal(pc.dataset.dcard);
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.gtab) { GT.tab = b.dataset.gtab; return renderGearTab(CBHub.char(profile, heroCls)); }
    if (b.dataset.gsort) { GT.sort = b.dataset.gsort; return renderGearTab(CBHub.char(profile, heroCls)); }
    if (b.dataset.hero) { heroCls = b.dataset.hero; profile.last.cls = heroCls; save(); return renderHub(); }
    if (b.id === 'btnScribe') return openSheet('deck');
    if (b.dataset.unequip) { if (!CBHub.unequip(profile, heroCls, b.dataset.unequip)) return toast('Stash is full.'); }
    else if (b.dataset.equip) { const r = CBHub.equip(profile, heroCls, b.dataset.equip, b.dataset.slot); if (!r.ok) return toast(r.why); }
    else if (b.dataset.salvage) CBHub.salvage(profile, b.dataset.salvage);
    else return;
    save(); renderHub();
  });
  function toast(t) { modal(`<p>${esc(t)}</p><div class="row"><button class="btn primary" id="mClose">OK</button></div>`); $('mClose').onclick = closeModal; }

  // ---------- deck tab
  const sortCards = (a, b) => RAR_ORDER[CARDS[a.key].rarity] - RAR_ORDER[CARDS[b.key].rarity] || CARDS[a.key].name.localeCompare(CARDS[b.key].name) || (b.rank || 0) - (a.rank || 0);
  function cardHtml(card, acts) {
    const v = CB.rankedCard(card.key, card.rank || 0), base = CARDS[card.key];
    const max = (card.rank || 0) >= CB.MAX_RANK, need = max ? 0 : CBHub.rankCost(card);
    const xp = max ? '' : `<div class="il">XP ${card.xp || 0} / ${need.xp} to +${(card.rank || 0) + 1} (and ${need.gold} gold)</div><div class="xpbar"><i style="width:${Math.min(100, 100 * (card.xp || 0) / need.xp)}%"></i></div>`;
    if (acts !== undefined && !acts.noGrid) return `<div class="dcard">${cardBox(v)}${xp}${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
    return `<div class="item" style="--rc:${RC[base.rarity]}"><div class="ih"><b>${esc(v.name)}</b><span>${base.rarity} &middot; ${v.cost} mana</span></div><div class="st">${esc(v.text)}</div>${xp}</div>`;
  }
  function renderDeckTab(c) {
    const chk = CBHub.deckCheck(c.deck), n = chk.counts;
    const deck = c.deck.slice().sort(sortCards).map(k => cardHtml(k, `<button class="btn" data-up="${k.id}">Upgrade</button><button class="btn" data-remove="${k.id}" ${c.deck.length <= CB.DECK_MIN ? 'disabled' : ''}>Remove</button>`)).join('');
    const coll = c.cards.slice().sort(sortCards).map(k => { const a = CBHub.canAdd(c, k.id); return cardHtml(k, `<button class="btn" data-add="${k.id}" ${a.ok ? '' : `disabled title="${esc(a.why)}"`}>Add to deck</button><button class="btn" data-up="${k.id}">Upgrade</button>`); }).join('');
    const spare = c.cards.filter(k => c.deck.some(d => d.key === k.key && (d.rank || 0) < CB.MAX_RANK)).length;
    $('hpDeck').innerHTML = `<p class="savenote" style="margin:0 0 8px">Deck rules: ${CB.DECK_MIN} to ${CB.DECK_MAX} cards, at most 2 Gold, 4 Blue and 6 Green. Feed spare cards into a card to rank it up (to +${CB.MAX_RANK}). Each card gives White 1, Green 3, Blue 9, Gold 27 XP, doubled when it's a copy of the same card. Reaching rank N costs N x 2/4/8/16 XP (by rarity) plus 5x that in gold.</p>
      <div class="two"><div><h3><span>Deck ${c.deck.length}</span><span>${n.Gold}/2 Gold &middot; ${n.Blue}/4 Blue &middot; ${n.Green}/6 Green &middot; ${n.White} White</span></h3>
        ${chk.ok ? '' : `<p class="down" style="margin:0 0 6px;font-size:13px">Deck ${chk.problems.join(', ')}.</p>`}<div class="list tall cardgrid">${deck}</div></div>
      <div><h3><span>Collection ${c.cards.length}</span>${spare ? `<button class="btn" id="btnFeedAll" style="padding:3px 9px;font-size:13px">Feed ${spare} spare cop${spare === 1 ? 'y' : 'ies'} into your deck</button>` : ''}</h3>
        <div class="list tall cardgrid">${coll || '<span class="muted">Empty. Cards dropped on a run land here when you make it home.</span>'}</div></div></div>`;
    if ($('btnFeedAll')) $('btnFeedAll').onclick = feedAll;
  }
  $('hpDeck').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.add) { const r = CBHub.addToDeck(profile, heroCls, b.dataset.add); if (!r.ok) return toast(r.why); }
    else if (b.dataset.remove) { const r = CBHub.removeFromDeck(profile, heroCls, b.dataset.remove); if (!r.ok) return toast(r.why); }
    else if (b.dataset.up) return upgradeModal(b.dataset.up);
    else return;
    save(); renderHub();
  });
  function feedAll() {
    const c = CBHub.char(profile, heroCls); let ups = 0, fed = 0;
    for (const k of c.cards.slice()) {
      const t = c.deck.filter(d => d.key === k.key && (d.rank || 0) < CB.MAX_RANK).sort((a, b) => (b.rank || 0) - (a.rank || 0))[0];
      if (!t) continue; const r = CBHub.feed(profile, heroCls, t.id, [k.id]); if (r.ok) { fed++; ups += r.ups; }
    }
    for (const d of c.deck) ups += CBHub.rankUp(profile, d);
    save(); renderHub();
    toast(`Fed ${fed} card${fed === 1 ? '' : 's'}: ${ups} rank-up${ups === 1 ? '' : 's'}.${ups ? '' : ' Not enough XP or gold for a rank yet; the XP is banked on the card.'}`);
  }
  function upgradeModal(targetId) {
    const c = CBHub.char(profile, heroCls);
    const t = c.deck.find(x => x.id === targetId) || c.cards.find(x => x.id === targetId); if (!t) return;
    const fod = c.cards.filter(x => x.id !== targetId).sort((a, b) => (a.key === t.key ? -1 : 0) - (b.key === t.key ? -1 : 0) || sortCards(a, b));
    if ((t.rank || 0) >= CB.MAX_RANK) return toast('That card is already at +' + CB.MAX_RANK + '.');
    modal(`<h2>Upgrade</h2><div style="display:flex;gap:14px;align-items:center">${cardBox(CB.rankedCard(t.key, t.rank || 0), 150)}<div style="flex:1">${cardHtml(t)}</div></div>
      <p>Feed cards from your collection. Deck cards can't be fed.</p>
      <div class="feedlist">${fod.map(k => { const v = CB.rankedCard(k.key, k.rank || 0); return `<label style="--rc:${RC[CARDS[k.key].rarity]}"><input type="checkbox" value="${k.id}"><span>${esc(v.name)} <span class="muted">${CARDS[k.key].rarity}</span></span><span class="muted">+${CBHub.feedXp(t, k)} XP</span></label>`; }).join('') || '<span class="muted">No spare cards in your collection.</span>'}</div>
      <p id="upPrev" class="muted"></p>
      <div class="row"><button class="btn primary" id="mFeed" disabled>Feed</button><button class="btn" id="mClose">Close</button></div>`);
    const prev = () => {
      const ids = [...$('modalBox').querySelectorAll('input:checked')].map(i => i.value);
      const gain = ids.reduce((s, id) => s + CBHub.feedXp(t, c.cards.find(x => x.id === id)), 0);
      let xp = (t.xp || 0) + gain, rank = t.rank || 0, gold = profile.gold, cost = 0;
      while (rank < CB.MAX_RANK) { const k = CBHub.rankCost({ key: t.key, rank }); if (xp < k.xp || gold < k.gold) break; xp -= k.xp; gold -= k.gold; cost += k.gold; rank++; }
      $('upPrev').innerHTML = ids.length ? `+${gain} XP. Result: <b>+${rank}</b>${rank > (t.rank || 0) ? ` for ${cost} gold` : ''}, ${xp} XP banked.` + (rank < CB.MAX_RANK && xp >= CBHub.rankCost({ key: t.key, rank }).xp ? ' <span class="down">Not enough gold for the next rank.</span>' : '') : '';
      $('mFeed').disabled = !ids.length;
    };
    $('modalBox').querySelector('.feedlist').addEventListener('change', prev);
    $('mClose').onclick = closeModal;
    $('mFeed').onclick = () => { const ids = [...$('modalBox').querySelectorAll('input:checked')].map(i => i.value); CBHub.feed(profile, heroCls, t.id, ids); save(); closeModal(); renderHub(); };
  }

  // ---------- history tab
  function renderLogTab() {
    const L = { victory: 'Killed the boss', extracted: 'Extracted', dead: 'Died', abandoned: 'Left early' };
    $('hpLog').innerHTML = profile.history.length ? `<div class="list tall">${profile.history.map(h => `<div class="item" style="--rc:${h.result === 'dead' ? 'var(--hp)' : h.result === 'victory' ? 'var(--r-gold)' : 'var(--good)'}"><div class="ih"><b>${L[h.result] || h.result}</b><span>${h.cls} &middot; Map +${h.level}</span></div><div class="st">Row ${h.row > ROWS ? 'boss' : h.row}. Brought home ${h.items} item${h.items === 1 ? '' : 's'}, ${h.cards} card${h.cards === 1 ? '' : 's'}, ${h.gold} gold.</div><div class="il">${new Date(h.at).toLocaleString()}</div></div>`).join('')}</div>` : '<span class="muted">No runs yet.</span>';
  }

  // ---------- Merchant Dace (town shop)
  function restockIn() { const ms = Math.max(0, profile.shop.at + CBHub.SHOP_RESTOCK_MS - Date.now()); const h = Math.floor(ms / 3600000), m = Math.ceil((ms % 3600000) / 60000); return h ? `${h}h ${m}m` : `${m}m`; }
  function renderShopTab(c) {
    if (CBHub.shopDue(profile)) { CBHub.refreshShop(profile, DATA, profile.last.level || 0); save(); }
    const sh = profile.shop, full = profile.stash.length >= CBHub.STASH_MAX;
    const rows = sh.items.map((it, i) => {
